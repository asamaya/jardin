<!-- Objetivo: Agregar un registro a TMCARGOS -->
<!DOCTYPE html>
<html lang="es">
<!-- Inicio del Bloque Head (Metadata) -->
{% include 'm01_sitio/zhead.html' %}
<!-- Fin del Bloque Head (Metadata) -->

<!-- Inicio del Body -->

<body onload="startTime()">
    <!--- Inicio del Bloque Menú Nivel #1 (Módulo Administración) -->
    {% include 'm02_login/paso03_admin_zmenu_n1.html' %}
    <!--- Fin del Bloque Menú Nivel #1 (Módulo Administración) -->

    <!--- Inicio del Bloque Menú Nivel #2 (TMCargos) -->
    {% include 'm04_tmcargos/tmcargos01_zmenu_n2.html' %}
    <!--- Fin del Bloque Menú Nivel #2 (TMCargos) -->

    <!--Inicio del Bloque Centro / Container Principal -->
    <div class="container text-center">
        <div class="mb-0 p-3 bg-light">
            <div class="row">
                <div class="col-md-4"> </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header text-center">
                            <h4 style="color:black">
                                Agregar un Cargo nuevo
                            </h4>
                        </div>
                        <div class="card-footer text-center">
                            <div class="alert alert-danger" role="alert">
                                <strong>
                                    {{ ymensaje }}
                                </strong>
                            </div>
                        </div>





                        <div class="card-body">
                            <!-- Inicio del Formulario -->
                            <form action="/tmcargos/agregar_crud" method="POST">
                                <div class="mb-3">
                                    <label for="txt_descripcion" class="form-label">
                                        Descripción:
                                    </label>
                                    <input type="text" class="form-control" id="txt_descripcion" name="txt_descripcion"
                                        placeholder="Escriba la descripción" required />
                                </div>

                                <div class="mb-3">
                                    <label for="txt_sueldo" class="form-label">
                                        Sueldo:
                                    </label>
                                    <input type="text" class="form-control" id="txt_sueldo" name="txt_sueldo"
                                        placeholder="Escriba el sueldo" required />
                                </div>
                                <div class="text-center">
                                    <button type="submit" value="Submit" class="btn btn-primary"
                                        title="Click para agregar un nuevo registro">
                                        Agregar
                                    </button>
                                    &nbsp; &nbsp; &nbsp;
                                    <button type="reset" value="Reset" class="btn btn-outline-info"
                                        title="Click para limpiar el formulario...">
                                        Limpiar
                                    </button>
                                </div>
                            </form>
                            <!-- Fin del Formulario -->
                        </div>
                    </div>
                </div>
                <div class="col-md-4"> </div>
            </div>
        </div>
        <br />



        <br />
    </div>
    <!--Fin del Bloque Centro / Cuerpo Container Principal -->
    <BR />
    <!--Inicio del Bloque Pie de página -->
    {% include 'm01_sitio/zpie.html' %}
    <!--Fin del Bloque Pie de Página -->
    <br />
</body>
<!-- Fin del Body -->

</html>
